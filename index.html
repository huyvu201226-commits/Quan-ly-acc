<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý ACC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="authscreen">
  <div class="box">
    <h1>Đăng nhập</h1>
    <p class="authsub">Nhập tên là vào xem được ngay, không cần chờ duyệt</p>
    <input id="loginName" placeholder="Tên đăng nhập của bạn" autocomplete="off">
    <input id="loginPass" placeholder="Mật khẩu (chỉ cần nếu bạn là quản trị viên)" type="password" autocomplete="off">
    <div id="loginError" class="fielderr"></div>
    <button id="loginBtn">Vào trang</button>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h2>Quản lý ACC</h2>
    <div class="zoomctl">
      <button id="zoomOutBtn" type="button" title="Thu nhỏ ảnh (xem được nhiều ảnh hơn)">－</button>
      <button id="zoomInBtn" type="button" title="Phóng to ảnh">＋</button>
    </div>
    <span class="who" id="whoAmI"></span>
    <button id="logoutBtn" class="ghost-btn">Thoát</button>
  </header>
  <nav>
    <button data-tab="home" class="active">Trang chủ</button>
    <button data-tab="all">Acc đã thêm</button>
    <button data-tab="trash" id="navTrash" class="hide">Thùng rác</button>
    <button data-tab="history" id="navHistory" class="hide">Lịch sử</button>
    <button data-tab="admin" id="navAdmin" class="hide">Quản trị</button>
  </nav>
  <main>
    <div id="tab-home">
      <div class="searchbar"><input id="searchInput" placeholder="Tìm theo mã x/x (vd 12/205) hoặc mô tả..."></div>
      <div id="homeResults" class="grid"></div>
    </div>
    <div id="tab-all" class="hide"></div>
    <div id="tab-trash" class="hide"><div id="trashList" class="grid"></div></div>
    <div id="tab-history" class="hide"><div id="historyList"></div></div>
    <div id="tab-admin" class="hide">
      <div id="superOnlySection" class="hide">
        <div class="section-h">Người dùng (chỉ xem) — Admin tổng có thể xóa</div>
        <div id="viewerUsers"></div>
        <div class="section-h">Quản trị viên</div>
        <div id="adminList"></div>
        <div class="addadmin-box">
          <input id="newAdminUser" placeholder="Tên đăng nhập admin mới">
          <input id="newAdminPass" placeholder="Mật khẩu" type="text">
          <button id="addAdminBtn">Thêm quản trị viên</button>
        </div>
      </div>
      <div id="adminNote" class="empty hide">Chỉ Admin tổng mới có thể quản lý người dùng và quản trị viên.</div>
    </div>
  </main>
  <button class="fab" id="addFab">+</button>
</div>

<!-- Firebase (dùng bản compat cho dễ, không cần build tool) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
